[package]
name = "rust-visualizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Explore Rust architecture, control flow, and source-grounded AI graph tours"
license = "MIT"
repository = "https://github.com/gu1p/rust-visualizer"
keywords = ["rust", "visualization", "architecture", "control-flow", "ai"]
categories = ["development-tools", "visualization"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
prost = "0.14"
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "deny"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
